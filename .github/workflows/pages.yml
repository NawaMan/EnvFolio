# Publish site/ to GitHub Pages, at https://nawaman.github.io/EnvFolio/.
#
# site/ is BUILT, not written here: EnvFolioPromotion's scripts/publish-envfolio-site.sh builds
# it (base path /EnvFolio) and copies it in. Edit the pages there, then rebuild. A push to main
# that changes site/ deploys it; Actions → Pages → Run workflow deploys it by hand.
#
# Needs Settings → Pages → Source: "GitHub Actions" (once).
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
