# Lint and test on a clean machine: Linux with bash 5, macOS with its own bash 3.2 (the minimum).
# Runs on every branch push and pull request, and is called by release.yml before a release.
name: Check

on:
  push:
    branches: ['**']        # branches only: a tag push is checked by release.yml
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck envfolio tools/*.sh tests/test-all.sh

  test-linux-bash5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats pass gnupg git tree tar gzip
      - run: tests/test-all.sh 5

  test-macos-bash32:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install bats-core pass
      # /bin/bash on macOS is 3.2; put it first so `env bash` (bats and envfolio) finds it,
      # not a Homebrew bash 5. test-all.sh fails if it is not 3.x.
      - run: PATH="/bin:$PATH" /bin/bash tests/test-all.sh 3
