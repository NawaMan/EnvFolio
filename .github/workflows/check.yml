# Lint and test on a clean machine: Linux with bash 5, macOS with its own bash 3.2 (the minimum).
# Runs on every branch push and pull request, and is called by release.yml before a release.
name: Check

on:
  push:
    branches: ['**']        # branches only: a tag push is checked by release.yml
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck folio tools/*.sh tests/test-all.sh

  # The runner starts steps with SIGPIPE ignored, and bash cannot undo that for its children:
  # `tr < /dev/urandom` (in `pass generate`, `text generate`) then never stops — on macOS it runs
  # forever and the test hangs. perl puts SIGPIPE back to default before running the tests.
  test-linux-bash5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats pass gnupg git tree tar gzip zsh
      - run: perl -e '$SIG{PIPE} = "DEFAULT"; exec @ARGV' tests/test-all.sh 5

  test-macos-bash32:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # coreutils for `timeout` only (some tests use it), linked alone so the tests still run
      # against macOS's own BSD tools.
      - name: Install dependencies
        run: |
          brew install bats-core pass coreutils
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$(brew --prefix)/bin/gtimeout" "$RUNNER_TEMP/bin/timeout"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # gpg 2.4.7, the stable line the booth and Linux run, built from source: Homebrew has only
      # its current gnupg (pulled in by pass), which test-macos-homebrew-gpg runs. The build links
      # Homebrew's libraries, so their versions are in the cache key.
      - name: Libraries for gnupg 2.4.7
        id: gnupg-libs
        run: |
          brew install libgpg-error libgcrypt libassuan libksba npth pinentry
          echo "versions=$(brew list --versions libgpg-error libgcrypt libassuan libksba npth | tr ' \n' '-_')" >> "$GITHUB_OUTPUT"
      - name: Cache gnupg 2.4.7
        id: gnupg-cache
        uses: actions/cache@v4
        with:
          path: ~/gnupg-2.4.7
          key: gnupg-2.4.7-${{ runner.os }}-${{ runner.arch }}-${{ steps.gnupg-libs.outputs.versions }}
      - name: Build gnupg 2.4.7
        if: steps.gnupg-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://gnupg.org/ftp/gcrypt/gnupg/gnupg-2.4.7.tar.bz2
          # Signed by the GnuPG release keys (Werner Koch, NIIBE Yutaka); checked when pinned.
          echo "7b24706e4da7e0e3b06ca068231027401f238102c41c909631349dcc3b85eb46  gnupg-2.4.7.tar.bz2" | shasum -a 256 -c -
          tar -xjf gnupg-2.4.7.tar.bz2
          cd gnupg-2.4.7
          ./configure --prefix="$HOME/gnupg-2.4.7" --with-pinentry-pgm="$(brew --prefix)/bin/pinentry" \
              --with-libgpg-error-prefix="$(brew --prefix libgpg-error)" \
              --with-libgcrypt-prefix="$(brew --prefix libgcrypt)" \
              --with-libassuan-prefix="$(brew --prefix libassuan)" \
              --with-ksba-prefix="$(brew --prefix libksba)" \
              --with-npth-prefix="$(brew --prefix npth)" \
              --disable-doc --disable-nls --disable-ldap --disable-gnutls --disable-sqlite \
              --disable-ccid-driver --disable-wks-tools
          make -j"$(sysctl -n hw.ncpu)"
          make install
      # First on PATH, ahead of Homebrew's; gpg2 too, as pass prefers it when there is one.
      - name: Use gnupg 2.4.7
        run: |
          ln -sf gpg "$HOME/gnupg-2.4.7/bin/gpg2"
          echo "$HOME/gnupg-2.4.7/bin" >> "$GITHUB_PATH"
      - run: gpg --version | head -n 1 && gpg2 --version | head -n 1
      # /bin/bash on macOS is 3.2; put it first so `env bash` (bats and folio) finds it,
      # not a Homebrew bash 5. test-all.sh fails if it is not 3.x.
      - run: PATH="/bin:$PATH" perl -e '$SIG{PIPE} = "DEFAULT"; exec @ARGV' /bin/bash tests/test-all.sh 3

  # Homebrew's own gpg (2.5.24 at the time of writing), the one a Mac gets: every test, and a real
  # post-quantum key (tests/gpg/gpg-pqc-real.bats, skipped on a gpg that cannot make one).
  # `brew update` first: the runner image can come with an older gnupg it thinks is current
  # (2.5.24 without the T8469 fix, where Homebrew has 2.5.24_1), which then fails every import.
  test-macos-homebrew-gpg:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          brew update
          brew install bats-core pass coreutils gnupg
          brew list --versions gnupg
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$(brew --prefix)/bin/gtimeout" "$RUNNER_TEMP/bin/timeout"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: gpg --version | head -n 1 && { gpg2 --version 2>/dev/null | head -n 1 || true; }
      - name: Post-quantum key, real gpg
        run: PATH="/bin:$PATH" perl -e '$SIG{PIPE} = "DEFAULT"; exec @ARGV' bats --print-output-on-failure tests/gpg/gpg-pqc-real.bats
      - name: Every test
        if: ${{ !cancelled() }}
        run: PATH="/bin:$PATH" perl -e '$SIG{PIPE} = "DEFAULT"; exec @ARGV' /bin/bash tests/test-all.sh 3
