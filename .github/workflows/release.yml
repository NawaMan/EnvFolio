# Release EnvFolio: Actions → Release → Run workflow (on main), or `gh workflow run release.yml`.
# Running it is the go-ahead; nothing here releases on its own.
#
#   prepare  the version: the `version` input, or APP_VERSION in ./envfolio without --rc
#            (0.2.0--rc -> 0.2.0); refused if not on main, the tag exists, or CHANGELOG.md has
#            neither a non-empty `## Unreleased` nor a `## <version>` section
#   check    shellcheck + every test on Linux (bash 5) and macOS (bash 3.2) — check.yml
#   release  commit APP_VERSION=<version> and `## <version> — <date>`, tag v<version>, push both;
#            a GitHub Release with envfolio and SHA256SUMS, notes from that CHANGELOG section;
#            then commit the next minor with --rc (0.3.0--rc) and a fresh `## Unreleased` to main
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0 (empty: APP_VERSION without --rc)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ $REF == refs/heads/main ]] || { echo "::error::Release from main, not $REF."; exit 1; }
          app=$(sed -n 's/^APP_VERSION=//p' envfolio)
          version=${INPUT_VERSION:-${app%--rc}}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::'$version' is not <major>.<minor>.<patch>."; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::error::Tag v$version already exists."; exit 1
          fi
          unreleased=$(awk '/^## / { if (on) exit; on = ($2 == "Unreleased"); next } on && NF' CHANGELOG.md)
          if grep -q '^## Unreleased' CHANGELOG.md; then
              [[ -n $unreleased ]] || { echo "::error::'## Unreleased' in CHANGELOG.md is empty."; exit 1; }
          else
              grep -q "^## $version " CHANGELOG.md \
                  || { echo "::error::CHANGELOG.md has neither '## Unreleased' nor '## $version'."; exit 1; }
          fi
          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: [prepare, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: v${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5    # the commit that was checked; the push fails if main moved since
      - run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Commit the release and tag it
        run: |
          set -euo pipefail
          sed -i "s/^APP_VERSION=.*/APP_VERSION=$VERSION/" envfolio
          sed -i "s/^## Unreleased\$/## $VERSION — $(date -u +%F)/" CHANGELOG.md
          git diff --quiet || git commit -qam "Release $VERSION"
          git tag -a "$TAG" -m "EnvFolio $VERSION"
          git push --atomic origin HEAD:main "refs/tags/$TAG"

      - name: Create the GitHub Release
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '/^## / { if (on) exit; on = ($2 == v); next } on' CHANGELOG.md \
              > "$RUNNER_TEMP/notes.md"
          sha256sum envfolio > "$RUNNER_TEMP/SHA256SUMS"
          gh release create "$TAG" envfolio "$RUNNER_TEMP/SHA256SUMS" \
              --verify-tag --title "EnvFolio $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Start the next version on main
        run: |
          set -euo pipefail
          IFS=. read -r major minor _ <<< "$VERSION"
          next="$major.$((minor + 1)).0--rc"
          sed -i "s/^APP_VERSION=.*/APP_VERSION=$next/" envfolio
          awk '!done && /^## / { print "## Unreleased\n"; done = 1 } { print }' CHANGELOG.md > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          git commit -qam "Start $next after releasing $VERSION"
          git push origin HEAD:main
