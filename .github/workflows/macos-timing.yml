# Experiment for todo #162 (macOS tests 1.4–2.5× slower since the November runner image).
# Not for main: times gpg itself, then part of the suite serially and with --jobs 3, on the
# current image and the older macos-15 one.
name: macOS timing (experiment)

on:
  push:
    branches: ['162-macos-timing']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-latest]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          brew update
          brew install bats-core pass coreutils gnupg parallel
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$(brew --prefix)/bin/gtimeout" "$RUNNER_TEMP/bin/timeout"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Runner
        run: |
          sw_vers; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          echo "ImageVersion=${ImageVersion:-?}"
          gpg --version | head -n 1
      # One test's fixed costs, in a throwaway GNUPGHOME: key, agent, a store.
      - name: gpg and folio, one at a time
        run: |
          ms() { perl -MTime::HiRes=time -e 'printf "%d\n", time*1000'; }
          t() { local s e; s=$(ms); "$@" >/dev/null 2>&1; e=$(ms); echo "$(( e - s )) ms  $*"; }
          d=$(mktemp -d)
          export HOME="$d/home" GNUPGHOME="$d/g" FOLIO_STORE_DIR="$d/store" XDG_STATE_HOME="$d/state"
          export PASSWORD_STORE_DIR="$FOLIO_STORE_DIR" GIT_CONFIG_GLOBAL="$d/no-gitconfig" GIT_CONFIG_NOSYSTEM=1
          mkdir -p "$HOME" && mkdir -m 700 "$GNUPGHOME"
          for i in 1 2 3 4 5; do
              t gpg --batch --passphrase '' --quick-generate-key "T$i <t$i@example.com>" default default never
          done
          for i in 1 2 3; do t gpgconf --kill all; t gpg-connect-agent /bye; done
          t cp -R "$GNUPGHOME" "$d/g-copy"
          t ./folio init --key t1@example.com
          t ./folio insert text -t jane web/user
          t ./folio show text web/user
          t bash -c 'printf "s3cr3t\n" | ./folio insert secret -m web/github'
          t ./folio show secret web/github
          gpgconf --kill all; rm -rf "$d"
      # Where `folio init` spends its ~3 s on macOS (315 ms on Linux): each traced line with a
      # timestamp, then the steps that took longest. No secret is involved: a no-passphrase test key.
      - name: Trace folio init
        if: ${{ !cancelled() }}
        run: |
          d=$(mktemp -d)
          export HOME="$d/home" GNUPGHOME="$d/g" FOLIO_STORE_DIR="$d/store" XDG_STATE_HOME="$d/state"
          export PASSWORD_STORE_DIR="$FOLIO_STORE_DIR" GIT_CONFIG_GLOBAL="$d/no-gitconfig" GIT_CONFIG_NOSYSTEM=1
          mkdir -p "$HOME" && mkdir -m 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-generate-key "T <t@example.com>" default default never 2>/dev/null
          export PS4='+ $(gdate +%s%3N) ${FUNCNAME[0]:-main}:${LINENO} '
          /bin/bash -x ./folio init --key t@example.com </dev/null >/dev/null 2>"$d/trace" || true
          echo "lines traced: $(wc -l < "$d/trace")"
          awk '$1=="+" || $1 ~ /^\++$/ { t=$2; if (p) printf "%6d ms  %s\n", t-p, prev; p=t; prev=$0 }' "$d/trace" \
              | sort -rn | head -n 25 | cut -c1-200
          # The same with no tracing overhead, three times.
          for i in 1 2 3; do
              rm -rf "$FOLIO_STORE_DIR"; s=$(gdate +%s%3N)
              PS4='+ ' ./folio init --key t@example.com </dev/null >/dev/null 2>&1; echo "init: $(( $(gdate +%s%3N) - s )) ms"
          done
          gpgconf --kill all; rm -rf "$d"
