display-name = "Host gpg-agent"
display-disc = "gpg in the booth uses the host's gpg-agent: pinentry and the passphrase cache stay on the host"
display-detail = """Mounts the host's gpg-agent socket (${XDG_RUNTIME_DIR}/gnupg/S.gpg-agent) at the same path in the booth, where the booth's gpg looks, so every gpg there — folio, pass, git signing — is served by the host's agent: the passphrase is asked on the host and cached there, and the booth runs no agent of its own. Use it with envfolio+store-host: the host's agent holds only the host's keys, so a store whose key is the booth's own (envfolio alone, +store-cache) cannot be opened through it. The booth never asks for a passphrase: every booth shell has GPG_TTY=/dev/null, so a passphrase the host has not cached makes gpg fail ("Inappropriate ioctl for device") rather than the host's pinentry asking on some other terminal. Unlock on the host first, by any gpg decrypt there (`just claude` does it). The main socket, not the restricted extra one: the agent keeps a separate passphrase cache for that, which unlocking on the host would not reach; restricting it would guard little beside +store-host, which mounts the keys themselves. Where the host has no such socket (macOS, XDG_RUNTIME_DIR unset) the mount is left out, and where the booth's gpg would not use the mounted socket GPG_TTY is left alone: either way the booth's gpg runs its own agent, asking in the booth, as without this template. A host socket cannot be passed into a Kata-isolated booth."""
tags = ["gpg", "pinentry", "host"]

run-args = [
    "-v", "${XDG_RUNTIME_DIR}/gnupg/S.gpg-agent:${XDG_RUNTIME_DIR}/gnupg/S.gpg-agent",
]

# Early, before anything in the booth may run gpg.
[segments]
"startup--20.sh" = """
# Docker creates the folders above the mounted socket (/run/user/<uid> and its gnupg) owned by
# root, and gpg ignores a socket folder when it or its parent is not its own (it would start an
# agent of its own): give both to coder. Then, only when gpg does use the host's socket, point
# every booth shell's GPG_TTY at /dev/null, so the host's pinentry never asks on a wrong
# terminal. Otherwise gpg runs the booth's own agent and asks in the booth, as without this
# template. Nothing changes when the socket is not mounted. Runs in a subshell: never fails the
# start.
(
    profile=/etc/profile.d/95-host-agent--profile.sh
    sudo rm -f "$profile"
    run="/run/user/$(id -u)"
    [ -S "$run/gnupg/S.gpg-agent" ] || exit 0
    for d in "$run" "$run/gnupg"; do
        if [ ! -O "$d" ]; then
            sudo chown "$(id -u):$(id -g)" "$d" && sudo chmod 700 "$d"
        fi
    done
    [ "$(gpgconf --list-dirs agent-socket 2>/dev/null)" = "$run/gnupg/S.gpg-agent" ] || exit 0
    printf '%s\\n' '# Written by the host-agent template: gpg uses the host agent.' \\
                  'export GPG_TTY=/dev/null' \\
        | sudo tee "$profile" >/dev/null
) || true
"""
