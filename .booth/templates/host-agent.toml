display-name = "Host gpg-agent"
display-disc = "gpg in the booth uses the host's gpg-agent: pinentry and the passphrase cache stay on the host"
display-detail = """Mounts the host's gpg-agent socket (${XDG_RUNTIME_DIR}/gnupg/S.gpg-agent) at the same path in the booth, where the booth's gpg looks, so every gpg there — folio, pass, git signing — is served by the host's agent: the passphrase is asked on the host and cached there, and the booth runs no agent of its own. Use it with envfolio+store-host: the host's agent holds only the host's keys, so a store whose key is the booth's own (envfolio alone, +store-cache) cannot be opened through it. The booth never asks for a passphrase: every booth shell has GPG_TTY=/dev/null, so a passphrase the host has not cached makes gpg fail ("Inappropriate ioctl for device") rather than the host's pinentry asking on some other terminal. Unlock on the host first, by any gpg decrypt there (`just claude` does it). The main socket, not the restricted extra one: the agent keeps a separate passphrase cache for that, which unlocking on the host would not reach; restricting it would guard little beside +store-host, which mounts the keys themselves. Where the host has no such socket (macOS, XDG_RUNTIME_DIR unset) the mount is left out and the booth's gpg runs its own agent, asking in the booth, as without this template. A host socket cannot be passed into a Kata-isolated booth."""
tags = ["gpg", "pinentry", "host"]

run-args = [
    "-v", "${XDG_RUNTIME_DIR}/gnupg/S.gpg-agent:${XDG_RUNTIME_DIR}/gnupg/S.gpg-agent",
]

# Early, before anything in the booth may run gpg.
[segments]
"startup--20.sh" = """
# Docker creates the folder above the mounted socket owned by root, and gpg ignores a socket
# folder it does not own (it would start an agent of its own): give it to coder. Then point
# every booth shell's GPG_TTY at /dev/null, so the host's pinentry never asks on a wrong terminal.
# Nothing changes when the socket is not mounted. Runs in a subshell: never fails the start.
(
    dir="/run/user/$(id -u)/gnupg"
    [ -S "$dir/S.gpg-agent" ] || exit 0
    if [ ! -O "$dir" ]; then
        sudo chown "$(id -u):$(id -g)" "$dir" && sudo chmod 700 "$dir"
    fi
    printf '%s\\n' '# Written by the host-agent template: gpg uses the host agent.' \\
                  'export GPG_TTY=/dev/null' \\
        | sudo tee /etc/profile.d/95-host-agent--profile.sh >/dev/null
) || true
"""
