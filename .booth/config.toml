# Configured by: booth config --no-tui --overwrite --variant terminal --set silence-build --set writable-booth --select gnupg:2.5.24/tty-owner/apt-pkg:bats,pass,shellcheck,tmux/gh+token/bash/git-credential/shell-history/homebrew/claude-code+auto-accept+credential+settings-cache

variant = "terminal"

run-args = [
    "-e", "GH_TOKEN",
    "-e", "GITHUB_TOKEN",
    "-e", "GH_ENTERPRISE_TOKEN",
    "-e", "GH_HOST",
    "-v", "~/.gitconfig:/etc/cb-home-seed/.gitconfig:ro",
    "-v", "~/.claude.json:/etc/cb-home-seed/.claude.json:ro",
    "-v", "~/.claude/.credentials.json:/etc/cb-home/.claude/.credentials.json:ro"
]

cache-files = [
    "home/coder/.bash_history",
    "home/coder/.zsh_history"
]

cache-dirs = ["home/coder/.claude"]

silence-build = true
writable-booth = true
